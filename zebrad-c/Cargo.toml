[package]
name = "zebrad_c"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "Zebra's node, run in-process, behind a small C ABI shaped like monerod_c"

[lib]
crate-type = ["cdylib"]

# Zebra crates come from the patched tree at ../zebra (see nix/zebra-src.nix). Versions
# below match upstream Zebra's Cargo.lock, which ci/check-patches.sh enforces.
[dependencies]
zebrad = { path = "../zebra/zebrad", default-features = false, features = ["release_max_level_info"] }
zebra-chain = { path = "../zebra/zebra-chain" }
zebra-consensus = { path = "../zebra/zebra-consensus" }
zebra-rpc = { path = "../zebra/zebra-rpc" }
bytes = "1.10"
futures = "0.3"
http-body-util = "0.1.3"
metrics = "0.24"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.44", features = ["rt-multi-thread", "sync", "time", "macros"] }
toml = "1.0"
tonic = "0.14"
tower = { version = "0.4.13", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[workspace]
members = ["smoke"]

[profile.release]
# The host process must survive a Zebra panic: unwind, then catch it at the C boundary.
panic = "unwind"
# As upstream's release profile.
lto = "thin"
